    <style>
    body {
        text-align: center;
        background-color: black;
        color: white;
    }

    .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .item {
        text-align: center;
    }

    .slideshow {
        width: 70%;
        max-width: 1200px;
        margin: 30px auto;
        position: relative;
        aspect-ratio: 3 / 2;
        overflow: hidden;
    }

    .slideshow img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 2s ease-in-out;
    }

    #slide1 {
        opacity: 1;
    }

    #slide2 {
        opacity: 0;
    }

    .item img {
    border: 2px solid white;
    box-sizing: border-box;
    transition: transform 0.4s ease;
}

.item img:hover {
    transform: scale(1.03);
}



.top-slider {
    width: 90%;
    margin: 30px auto;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
}

.top-track {
    display: flex;
    gap: 20px;
    width: max-content;
}

.top-item {
    width: 300px;
    flex-shrink: 0;
    color: white;
    text-decoration: none;
}

.top-item img {
    width: 100%;
    display: block;
    border: 2px solid white;
    box-sizing: border-box;
}

.top-item p {
    text-align: center;
    font-size: 19px;
}

@media (max-width: 768px) {
    .top-item {
        width: 170px;
    }
}



.bottom-slider {
    width: 90%;
    margin: 30px auto;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
}

.bottom-track {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
    width: max-content;
}

.bottom-item {
    width: 300px;
    flex: 0 0 300px;
    color: white;
    text-decoration: none;
}

.bottom-item img {
    width: 100%;
    height: auto;
    display: block;
    border: 2px solid white;
    box-sizing: border-box;
}

.bottom-item p {
    text-align: center;
    font-size: 19px;
}

@media (max-width: 768px) {
    .bottom-item {
        width: 170px;
        flex-basis: 170px;
    }
}


.first-visit {
    opacity: 0;
    animation: firstFadeIn 4s ease forwards;
}

/* 2回目以降 */
.normal-visit {
    opacity: 0;
    animation: normalFadeIn 2s ease forwards;
}

@keyframes firstFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes normalFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.home-return {
    opacity: 0;
    transform: translateY(0);
    animation: homeReturnFade 0.8s ease forwards;
}

@keyframes homeReturnFade {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}



img {
    -webkit-user-drag: none;
    user-select: none;
}

.top-slider,
.bottom-slider {
    opacity: 0;
}

.slider-show {
    animation: sliderFadeIn 2s ease forwards;
}

@keyframes sliderFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.gallery-title {
    opacity: 0;
}

.gallery-show {
    animation: galleryFadeIn 3s ease forwards;
}

@keyframes galleryFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.route-section {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1.5s ease, transform 1.5s ease;
}

.route-section.show {
    opacity: 1;
    transform: translateY(0);
}

.route-section.route-home-return {
    opacity: 0;
    transform: translateY(0);
    animation: homeReturnFade 1.5s ease-in-out forwards;
}






.instagram {
    text-align: center;
    margin: 80px 0 30px;
}

.instagram img {
    width: 45px;
    height: 45px;
}

.instagram {
    text-align: center;

}

.instagram a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-decoration: none;
    font-size: 20px;
}

.instagram img {
    width: 45px;
    height: 45px;
}
